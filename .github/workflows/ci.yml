name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPatternError: |
            The subject "{subject}" does not match the Conventional Commits
            subject rules. Rewrite the PR title to start with a lowercase
            verb and avoid Start Case, PascalCase or UPPER CASE.
          # Reject Start Case / PascalCase / UPPER CASE subjects so a
          # squash-merge on main never lands a non-parseable header for
          # semantic-release to trip on.
          subjectPattern: ^(?![A-Z])(?!.*[A-Z]{2,}).+$

  commitlint:
    name: Commit lint (branch commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
          firstParent: false
          failOnWarnings: false
          failOnErrors: true
          helpURL: https://www.conventionalcommits.org/

  mobile-test:
    name: Mobile — test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @xpeak/mobile test

      - name: Build
        run: pnpm --filter @xpeak/mobile build

  api-test:
    name: API — format + build + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xpeak
          POSTGRES_PASSWORD: xpeak
          POSTGRES_DB: xpeak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xpeak -d xpeak_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/api/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api/packages.lock.json', 'apps/api.Tests/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore api
        working-directory: apps/api
        run: dotnet restore --locked-mode

      - name: Restore api.Tests
        working-directory: apps/api.Tests
        run: dotnet restore --locked-mode

      - name: Format check
        working-directory: apps/api
        run: dotnet format --verify-no-changes --no-restore

      - name: Format check (tests)
        working-directory: apps/api.Tests
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        working-directory: apps/api.Tests
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        working-directory: apps/api.Tests
        env:
          # Testcontainers reads DOCKER_HOST; on GH Actions the docker
          # daemon socket is already available at /var/run/docker.sock.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: dotnet test --no-build --configuration Release --logger "trx"
